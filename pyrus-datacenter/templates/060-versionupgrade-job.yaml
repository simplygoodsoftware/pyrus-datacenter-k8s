---
apiVersion: batch/v1
kind: Job
metadata:
  name: &name upgrade-version-{{ .Values.tagsContainers.All }}
  labels: &selector
    app: *name
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
{{- if gt .Release.Revision 1 }}
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "1"
{{- end }}
spec:
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels: *selector
    spec:
      restartPolicy: OnFailure
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: docker-pyrus-cred
{{- end }}
      initContainers:

{{- if or (not .Values.database.external) $.Values.elasticsearch.internalChart (not $.Values.logs.external) $.Values.clickhouse.internal }}
        - name: depends-on
          image: {{ .Values.containersRepo.default }}/k8s-waits
          imagePullPolicy: {{ .Values.pullPolicy | default "IfNotPresent" }}
          command:
            - wait_endpoints
{{-   if not .Values.database.external }}
            - {{ .Release.Namespace }}/endpoints/pyrus-postgresql
{{-   end }}
{{-   if $.Values.elasticsearch.internalChart }}
            - {{ .Release.Namespace }}/endpoints/pyrus-elastic
{{-   end }}
{{-   if not $.Values.logs.external }}
            - {{ .Release.Namespace }}/endpoints/pyrus-logs-pgsql
{{-   end }}
{{-   if $.Values.clickhouse.internal }}
            - {{ .Release.Namespace }}/endpoints/{{ $.Values.clickhouse.clusterName }}-shard-0
{{-   end }}
{{- end }}
        - name: wait-setup-variable-complite
          image: {{ .Values.containersRepo.default }}/k8s-waits
          imagePullPolicy: {{ .Values.pullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - kubectl wait --for=condition=complete job.batch/set-pyrus-setupparam --timeout=600s

{{- range $.Values.versionUpgradeHistoryBefore1121 }}
{{- $upversion := . }}
        - name: up-to-{{ $upversion | replace "." "-" }}
          image: {{ $.Values.containersRepo.default }}/pyrus-setup:{{ $upversion }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          command:
            - sh
            - -c
            - |
              export VERSION_IS=$(dotnet Pyrus.DataMigrations.dll --version \
                | sed -nr '/version is [0-9.]+/{s/.*version is ([0-9.]*)$/\1/;p}')
              if [ -z "$VERSION_IS" ];then
                    echo "SKIP: may be version is to new, try to check it in future versions..."
                    exit 0
              fi
              
              printf "Current version: ${VERSION_IS}"
              
              printf "{{ $upversion }}\n${VERSION_IS}\n" \
                | sort -V | head -n 1 | grep -q "{{ $upversion }}" && echo " skip" && exit 0
              
              echo "Upping it."

              dotnet Pyrus.DataMigrations.dll --update
{{- end }}

{{-   if not $.Values.pyrusSetupParam.s3 }}
{{-     fail "\n\n! BREAK ! NEED to define .Values.pyrusSetupParam.s3\n" }}
{{-   end }}

{{-   if and (semverCompare ">=1.12.1" $.Values.tagsContainers.All) $.Values.versionUpgradeHistoryBefore1121 }}
{{-     if eq .Values.pyrusSetupParam.s3.storageType "Azure" }}
{{-       if not .Values.pyrusSetupParam.s3.azureConfig  }}
{{-         fail "\n\n! BREAK ! .Values.pyrusSetupParam.s3.azureConfig must be specified for Azure\n" }}
{{-       end }}
        - name: setup-s3-storrage-azure
          image: {{ .Values.containersRepo.default }}/{{ .Values.imageDevPrefix }}pyrus-setup:1.12.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          args: [ "--setup", "-id", "9911571", "-v", {{ .Values.pyrusSetupParam.s3.azureConfig | quote }}]
{{-     end }}

        - name: setup-s3-storrage-1210
          image: {{ .Values.containersRepo.default }}/{{ .Values.imageDevPrefix }}pyrus-setup:1.12.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          command:
            - sh
            - -c
            - |
              export VERSION_IS=$(dotnet Pyrus.DataMigrations.dll --version \
                | sed -nr '/version is [0-9.]+/{s/.*version is ([0-9.]*)$/\1/;p}')
              if [ -z "$VERSION_IS" ];then
                    echo "SKIP: may be version is to new, try to check it in future versions..."
                    exit 0
              fi
              
              dotnet Pyrus.DataMigrations.dll                            \
                  --configure-s3                                         \
                  --accessKey {{ .Values.pyrusSetupParam.s3.keyId }}     \
                  --secretKey {{ .Values.pyrusSetupParam.s3.secretKey }} \
                  --bucket {{ .Values.pyrusSetupParam.s3.buket }}        \
{{-     if .Values.pyrusSetupParam.s3.storageType }}
{{-       $storageTypes := list "Aws" "MinIo" "Azure" "Mts" "VkCloud" }}
{{-       if not (has .Values.pyrusSetupParam.s3.storageType $storageTypes)  }}
{{-         fail "\n\n! BREAK ! .Values.pyrusSetupParam.s3.storageType must be in 'Aws', 'MinIo', 'Azure', 'Mts', 'VkCloud'\n" }}
{{-       end }}
                  --storageType {{ .Values.pyrusSetupParam.s3.storageType }}              \
{{-     end }}
                  --endpointUrl {{ .Values.pyrusSetupParam.s3.S3_BLOB_STORAGE_ENDPOINT }} \
{{-   end }}

{{-     range $.Values.versionUpgradeHistory1121 }}
{{-     $upversion := . }}
        - name: up-to-{{ $upversion | replace "." "-" }}
          image: {{ $.Values.containersRepo.default }}/pyrus-setup:{{ $upversion }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          command:
            - sh
            - -c
            - |
              export VERSION_IS=$(dotnet Pyrus.DataMigrations.dll --version \
                | sed -nr '/version is [0-9.]+/{s/.*version is ([0-9.]*)$/\1/;p}')
              if [ -z "$VERSION_IS" ];then
                    echo "SKIP: may be version is to new, try to check it in future versions..."
                    exit 0
              fi
              
              printf "Current version: ${VERSION_IS}"
              
              printf "{{ $upversion }}\n${VERSION_IS}\n" \
                | sort -V | head -n 1 | grep -q "{{ $upversion }}" && echo " skip" && exit 0
              
              echo " upping it..."
              dotnet Pyrus.DataMigrations.dll --update --noninteractive
{{-     end }}

        - name: setup-license-variables
          image: {{ .Values.containersRepo.default }}/{{ .Values.imageDevPrefix }}pyrus-setup:{{ .Values.tagsContainers.All }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          args: ["--setup", "-id", "100000", "-v", "{{ .Values.pyrusSetupParam.license }}"]

        - name: hocus-correction
          image: {{ $.Values.containersRepo.default }}/pyrus-setup:{{ $.Values.tagsContainers.All }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          args: [ "--setup", "-id", "1090005", "-v", "pyrus-hocus:8009"]

{{-     if semverCompare ">=1.25.0" $.Values.tagsContainers.All }}
{{-       $pyrusDataMigrations := "dotnet Pyrus.DataMigrations.dll" }}
        - name: configure-report-engine
          image: {{ $.Values.containersRepo.default }}/{{ $.Values.imageDevPrefix }}pyrus-setup:{{ $.Values.tagsContainers.All }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          command:
            - sh
            - -c
            - |
              set -e

{{-       if $.Values.reportEngine.enabled }}
{{-         $clickhouseCluster := $.Values.clickhouse.clusterName }}
{{-         $clickhousePort := "8123" }}
{{-         $clickhouseHost := printf "%s-shard-0.%s.svc.cluster.local" $.Values.clickhouse.clusterName .Release.Namespace }}
{{-         $clickhouseUser := "pyrus_writer" }}
{{-         $clickhousePassword := "" }}
{{-         if $.Values.clickhouse.internal }}
{{-           $clickhousePassword = required "\n\n! BREAK ! .Values.clickhouse.clickhouse.users.pyrus_writer.password must be specified for reportEngine.enabled=true with internal clickhouse\n" $.Values.clickhouse.clickhouse.users.pyrus_writer.password }}
{{-         else }}
{{-           $clickhousePort = required "\n\n! BREAK ! .Values.clickhouse.externalPort must be specified for reportEngine.enabled=true with external clickhouse\n" $.Values.clickhouse.externalPort }}
{{-           $clickhouseHost = required "\n\n! BREAK ! .Values.clickhouse.externalHost must be specified for reportEngine.enabled=true with external clickhouse\n" $.Values.clickhouse.externalHost }}
{{-           $clickhouseUser = required "\n\n! BREAK ! .Values.clickhouse.externalUser must be specified for reportEngine.enabled=true with external clickhouse\n" $.Values.clickhouse.externalUser }}
{{-           $clickhousePassword = required "\n\n! BREAK ! .Values.clickhouse.externalUserPassword must be specified for reportEngine.enabled=true with external clickhouse\n" $.Values.clickhouse.externalUserPassword }}
{{-         end }}
              {{ $pyrusDataMigrations }} set-config -n "AnalyticDatabaseConnection:Cluster" -v {{ $clickhouseCluster | quote }}
              {{ $pyrusDataMigrations }} set-config -n "AnalyticDatabaseConnection:ReplicationEnabled" -v "true"
              {{ $pyrusDataMigrations }} set-config -n "AnalyticDatabaseConnection:Host" -v {{ $clickhouseHost | quote }}
              {{ $pyrusDataMigrations }} set-config -n "AnalyticDatabaseConnection:Port" -v {{ $clickhousePort | quote }}
              {{ $pyrusDataMigrations }} set-config -n "AnalyticDatabaseConnection:UserName" -v {{ $clickhouseUser | quote }}
              {{ $pyrusDataMigrations }} set-config -e -n "AnalyticDatabaseConnection:Password" -v {{ $clickhousePassword | quote }}

              {{ $pyrusDataMigrations }} update-clickhouse

              {{ $pyrusDataMigrations }} --setflag -f EnableOnlineTaskEventCrawler -v true
              {{ $pyrusDataMigrations }} --setflag -f CustomReportCreation -v true
              {{ $pyrusDataMigrations }} --setflag -f EnableReportDashboards -v true

              {{ $pyrusDataMigrations }} set-config -n "AnalyticEventCrawlerOptions:OnlineCrawlerSettings:BatchSize" -v "10000"
              {{ $pyrusDataMigrations }} set-config -n "AnalyticEventCrawlerOptions:OnlineCrawlerSettings:IntervalBetweenJobs" -v "00.00:00:08"
              {{ $pyrusDataMigrations }} set-config -n "AnalyticEventCrawlerOptions:OnlineCrawlerSettings:IsEnabled" -v "true"
{{-       else }}
              {{ $pyrusDataMigrations }} set-config -n "AnalyticEventCrawlerOptions:OnlineCrawlerSettings:IsEnabled" -v "false"

              {{ $pyrusDataMigrations }} --setflag -f EnableOnlineTaskEventCrawler -v false
              {{ $pyrusDataMigrations }} --setflag -f CustomReportCreation -v false
              {{ $pyrusDataMigrations }} --setflag -f EnableReportDashboards -v false
{{-       end }}
{{-     end }}

{{-     if $.Values.pyrusSetupParamByIdEveryUpgrade }}
        - name: setup-setupbyid-everyupgrade
          image: {{ $.Values.containersRepo.default }}/{{ $.Values.imageDevPrefix }}pyrus-setup:{{ $.Values.tagsContainers.All }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
{{-       range $name, $value := $.Values.pyrusSetupParamByIdEveryUpgrade }}
              dotnet Pyrus.DataMigrations.dll --setup -id "{{ $name }}" -v "{{ $value }}"
{{-       end }}
{{-     end }}

      containers:
        - name: check-relise-version-is-equal-bd-or-update
          image: {{ .Values.containersRepo.default }}/pyrus-setup:{{ .Values.tagsContainers.All }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: common-variables
          command:
            - sh
            - -c
            - |
              export VERSION_IS=$(dotnet Pyrus.DataMigrations.dll --version | sed -nr '/version is [0-9.]+/{s/.*version is ([0-9.]*)$/\1/;p}')
              if [ -z "$VERSION_IS" ];then
                    echo "ERROR: version did not detected"
                    exit 1
              fi
              
              printf "Current version: ${VERSION_IS}"
              printf "\nContainer version: {{ .Values.tagsContainers.All }}\n"
              
              if [ "${VERSION_IS}" != "{{ .Values.tagsContainers.All }}" ];then
                  echo "Update containers is fall"
                  exit 1
              fi
              
              echo "Version is equal"
              
