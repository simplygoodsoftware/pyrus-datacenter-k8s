## kubernetes.io/ingress.class=nginx
forceIngressClass: nginx

#### !!! Pyrus will work only with the first domain name !!! ######################
values-ingress-dir:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  addoneSnippetFromFileExclude:
    help-pyrus-com: "anyval"
  addoneSnippetFromFile:
    nginx.ingress.kubernetes.io/configuration-snippet: configs/ingress-https-redirect.cfg
  secretNameDefault: pyrus-ssl
  tls:
    - hosts:
        - YOURDOMAIN.COM

database:
  external: false

preview:
  external: false

logs:
  external: false

postgresqlOwnerCreds:
  pyrusdb:
    name: pyrusadm
    pass: pyruspwd

## If you did not use configs/connectionStrings.yaml you can change next line to control db creds from here
## uncomment_connectionStringsCreds -> connectionStringsCreds
