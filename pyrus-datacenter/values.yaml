reportEngine:
  enabled: false

clickhouse:
  internal: true
  imagePullSecrets: []

  clusterName: clickhouse

  # use only for external clickhouse (clickhouse.internal: false)
  externalUser: "pyrus_writer"
  externalUserPassword: "pyruspwd"
  externalHost: ""
  externalPort: ""

  keeper:
    enabled: false
    replicas: 3
    # nodeRoleSelectorLabel: keeper
    image:
      repository: simplygoodsoftware/pyrus-clickhouse-keeper
      tag: "1.26.1"
    settings:
      prometheus:
        endpoint: /metrics
        port: 7000
        metrics: true
        events: true
        asynchronous_metrics: true
      keeper_server:
        tcp_port: 2181
        server_id_from_hostname: true
        four_letter_word_white_list: "*"
        coordination_settings:
          operation_timeout_ms: "10000"
          session_timeout_ms: "30000"
          dead_session_check_period_ms: "500"
          heart_beat_interval_ms: "500"
          election_timeout_lower_bound_ms: "1000"
          election_timeout_upper_bound_ms: "2000"
          rotate_log_storage_interval: "100000"
          reserved_log_items: "100000"
          snapshot_distance: "75000"
          snapshots_to_keep: "3"
          stale_log_gap: "10000"
          fresh_log_gap: "200"
          max_requests_batch_size: "100"
          force_sync: true
          raft_logs_level: information
      logger:
        level: warning
        size: 200M
        count: 5
      send_crash_reports:
        enabled: false
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 2Gi
        cpu: 1000m
    storage:
      size: 10Gi

  clickhouse:
    enabled: false
    shardsCount: 1
    replicasCount: 2
    # nodeRoleSelectorLabel: clickhouse
    image:
      repository: simplygoodsoftware/pyrus-clickhouse
      tag: "1.26.1"
    settings:
      prometheus:
        endpoint: /metrics
        port: 8001
        metrics: true
        events: true
        asynchronous_metrics: true
      merge_tree:
        max_bytes_to_merge_at_max_space_in_pool: "161061273600"
        parts_to_delay_insert: "1000"
        parts_to_throw_insert: "3000"
        max_delay_to_insert: 1
        max_suspicious_broken_parts: "100"
      max_server_memory_usage: "7516192768" # 7 GiB
      max_connections: "4096"
      keep_alive_timeout: "3"
      max_concurrent_queries: "100"
      uncompressed_cache_size: "4294967296"
      mark_cache_size: "5368709120"
      mlock_executable: true
      logger:
        level: warning
        size: 1000M
        count: "10"
      compression:
        case:
          method: lz4
      send_crash_reports:
        enabled: false

    users:
      pyrus_writer:
        password: pyruspwd
        networks:
          ip: "10.0.0.0/8"
        grants:
          query:
          - >-
            GRANT SHOW,
            SELECT,
            INSERT,
            ALTER,
            CREATE TABLE,
            CREATE VIEW ON public.*,
            CREATE USER ON *.*,
            CLUSTER ON *.*,
            SELECT ON system.tables,
            CREATE ROW POLICY ON public.* WITH GRANT OPTION
          - GRANT CREATE DATABASE ON public.*

    resources:
      requests:
        memory: 2Gi
        cpu: 1
      limits:
        memory: 8Gi
        cpu: 4
    storage:
      size: 100Gi

  monitoring:
    enabled: false
    interval: 30s

  backup:
    enabled: false
    restore: false
    image:
      repository: simplygoodsoftware/pyrus-clickhouse-backup
      tag: "1.26.1"
    debug: false
    schedule: "0 0 * * *"
    # 1 - Mon, 7 - Sun
    FULL_BACKUP_WEEKDAY: "6"
    BACKUP_PASSWORD:
    BACKUPS_TO_KEEP_REMOTE: "7"
    network: "10.0.0.0/16"
    S3_ENDPOINT:
    S3_REGION:
    S3_BUCKET:
    S3_ACCESS_KEY:
    S3_SECRET_KEY:
    # {shard} is macro defined by clickhouse-operator
    S3_PATH: clickhouse/shard-{shard}
